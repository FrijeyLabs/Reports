:root{
  --coral:#EA5A5B;
  --coral-deep:#C9403F;
  --coral-soft:#F6C9C6;
  --cream:#FBF6EC;
  --cream-2:#F3E9D7;
  --paper-edge:#E7DAC2;
  --ink:#241E1C;
  --ink-soft:#5a4f49;
  --sage:#CFD2CB;
  --serif:"Cormorant","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --turn:900ms;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(1200px 900px at 50% 18%, #6f5d57 0%, #4b3f3b 45%, #302826 100%);
  min-height:100%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  padding:24px;
}
body::after{ /* ambient vignette */
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 120% at 50% 40%,transparent 55%,rgba(0,0,0,.45) 100%);
}

/* ---------- STAGE + BOOK ---------- */
.stage{
  perspective:2600px;
  width:100%;max-width:1120px;
  display:flex;align-items:center;justify-content:center;
}
.book{
  position:relative;
  width:min(94vw,1080px);
  aspect-ratio:3/2;
  max-height:86vh;
  transform-style:preserve-3d;
  filter:drop-shadow(0 34px 46px rgba(0,0,0,.5));
}
/* stacked page-edges (book thickness) */
.book::before,.book::after{
  content:"";position:absolute;top:1.4%;height:97.2%;width:12px;
  background:linear-gradient(90deg,#efe6d3,#d9cbb0 40%,#cbb994);
  z-index:0;border-radius:2px;
}
.book::before{right:-6px;box-shadow:2px 0 6px rgba(0,0,0,.28);}
.book::after{left:-6px;box-shadow:-2px 0 6px rgba(0,0,0,.28);}

.page{
  position:absolute;top:0;height:100%;width:50%;
  background:
    linear-gradient(135deg,var(--cream),var(--cream-2));
  overflow:hidden;
  z-index:1;
  padding:min(5.4%,42px);
  display:flex;flex-direction:column;
}
.page::after{ /* subtle paper texture + gutter shading */
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 2px,transparent 2px 4px);
  opacity:.6;
}
.leftPage{left:0;border-radius:8px 0 0 8px;
  box-shadow:inset -26px 0 40px -28px rgba(60,40,20,.55);}
.rightPage{right:0;border-radius:0 8px 8px 0;
  box-shadow:inset 26px 0 40px -28px rgba(60,40,20,.55);}

/* ---------- FLIPPING LEAF ---------- */
.flip{
  position:absolute;top:0;left:50%;width:50%;height:100%;
  transform-origin:left center;transform-style:preserve-3d;
  transform:rotateY(0deg);
  transition:transform var(--turn) cubic-bezier(.42,.02,.28,1);
  z-index:40;display:none;
}
.flip.show{display:block;}
.flip-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(135deg,var(--cream),var(--cream-2));
  overflow:hidden;padding:min(5.4%,42px);display:flex;flex-direction:column;
}
.flip-front{border-radius:0 8px 8px 0;box-shadow:inset 26px 0 40px -28px rgba(60,40,20,.55);}
.flip-back{transform:rotateY(180deg);border-radius:8px 0 0 8px;
  box-shadow:inset -26px 0 40px -28px rgba(60,40,20,.55);}
.flip-face::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 2px,transparent 2px 4px);opacity:.6;}
/* moving shade to fake the curl/shadow during a turn */
.shade{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 55%);}
.flip.turning .shade{animation:shadeSweep var(--turn) ease-in-out;}
@keyframes shadeSweep{0%{opacity:0}35%{opacity:.5}100%{opacity:0}}

/* ---------- PAGE CONTENT ---------- */
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;
  color:var(--coral-deep);margin:0 0 14px;}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.02;color:var(--ink);}
.h-xl{font-size:clamp(30px,5.4vw,60px);}
.h-lg{font-size:clamp(24px,3.6vw,40px);}
p{font-size:clamp(13px,1.45vw,16px);line-height:1.62;color:var(--ink-soft);margin:0 0 12px;}
.rule{height:2px;width:64px;background:var(--coral);border-radius:2px;margin:16px 0;}
.spacer{flex:1;}

.tag{display:inline-block;font:600 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--coral-deep);border:1.5px solid var(--coral-soft);background:rgba(234,90,91,.06);
  padding:6px 10px;border-radius:100px;margin:0 6px 6px 0;}
.meta{font:600 12px/1.5 var(--sans);letter-spacing:.04em;color:var(--ink);text-transform:uppercase;}
.meta span{color:var(--coral-deep);}

/* framed photo: cream matte + coral keyline */
.frame{background:#fff;padding:10px;border-radius:4px;
  box-shadow:0 10px 26px rgba(60,30,20,.22);border:1px solid #efe6d5;position:relative;}
.frame::before{content:"";position:absolute;inset:6px;border:1.5px solid var(--coral);
  border-radius:2px;pointer-events:none;z-index:2;}
.frame img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px;}

.avatar{width:clamp(78px,12vw,120px);aspect-ratio:1;border-radius:50%;object-fit:cover;
  border:3px solid #fff;box-shadow:0 8px 20px rgba(60,30,20,.28),0 0 0 5px rgba(234,90,91,.28);}

.svc{list-style:none;margin:8px 0 0;padding:0;}
.svc li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;
  border-bottom:1px solid rgba(180,150,110,.28);}
.svc li:last-child{border-bottom:0;}
.svc .ic{flex:0 0 34px;height:34px;border-radius:50%;background:rgba(234,90,91,.1);
  display:grid;place-items:center;color:var(--coral-deep);}
.svc b{font:600 14px/1.2 var(--sans);color:var(--ink);display:block;}
.svc small{font-size:12px;color:var(--ink-soft);}
.svc .ic svg{width:17px;height:17px;}

/* contact links */
.contact{list-style:none;margin:6px 0 0;padding:0;}
.contact li{margin:0 0 14px;}
.contact a{display:flex;gap:13px;align-items:center;text-decoration:none;color:var(--ink);}
.contact .ic{flex:0 0 42px;height:42px;border-radius:50%;background:var(--coral);color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 16px rgba(234,90,91,.4);transition:transform .2s;}
.contact a:hover .ic{transform:translateY(-2px) scale(1.05);}
.contact .ic svg{width:19px;height:19px;}
.contact small{display:block;font:600 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--coral-deep);margin-bottom:3px;}
.contact b{font:500 15px/1.2 var(--sans);}

/* cover / back (coral) */
.cover{background:
    radial-gradient(120% 90% at 30% 15%,#f0706f,transparent 60%),
    linear-gradient(150deg,var(--coral) 0%,var(--coral-deep) 100%);
  color:#fff;align-items:center;justify-content:center;text-align:center;}
.cover::after{opacity:.10;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px);}
.cover h1{color:#fff;}
.cover .rule{background:rgba(255,255,255,.85);}
.cover .kicker{font:600 12px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.9);}
.cover-logo{width:clamp(74px,12vw,116px);filter:brightness(0) invert(1);opacity:.96;margin-bottom:6px;}
.hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;
  font:600 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.92);}
.hint .arw{display:inline-block;animation:nudge 1.4s ease-in-out infinite;}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

/* endpaper */
.endpaper{align-items:center;justify-content:center;text-align:center;position:relative;}
.endpaper .wm{position:absolute;width:66%;opacity:.07;top:50%;left:50%;transform:translate(-50%,-50%);}
.endpaper .stamp{position:relative;z-index:2;}
.endpaper .stamp span{display:block;font:600 11px/1 var(--sans);letter-spacing:.4em;
  text-transform:uppercase;color:var(--coral-deep);}
.endpaper .stamp .yr{margin-top:10px;font-family:var(--serif);font-size:26px;letter-spacing:0;color:var(--ink);}

.pull{font-family:var(--serif);font-weight:500;font-size:clamp(16px,2.1vw,22px);
  line-height:1.35;color:var(--ink);font-style:italic;}
.pull b{color:var(--coral-deep);font-style:normal;font-weight:600;}

/* ---------- CONTROLS ---------- */
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:60;
  width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(6px);
  display:grid;place-items:center;transition:background .2s,opacity .2s;}
.nav:hover{background:rgba(255,255,255,.28);}
.nav:disabled{opacity:.25;cursor:default;}
.nav svg{width:22px;height:22px;}
.nav.prev{left:max(14px,3vw);}
.nav.next{right:max(14px,3vw);}
.counter{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;
  font:600 12px/1 var(--sans);letter-spacing:.22em;color:rgba(255,255,255,.85);
  background:rgba(0,0,0,.28);padding:9px 16px;border-radius:100px;backdrop-filter:blur(6px);}
.counter b{color:#fff;}

@media (max-width:760px){
  body{padding:14px;}
  .book{width:88vw;aspect-ratio:3/4;max-height:88vh;}
  .book::before,.book::after{display:none;}
  .page{width:100%;left:0;right:0;border-radius:10px;box-shadow:none;}
  .page.leftPage{display:none;}          /* single-page mode */
  .rightPage{box-shadow:none;}
  .flip{left:0;width:100%;}
  .flip-front,.flip-back{border-radius:10px;box-shadow:none;}
  .nav{width:44px;height:44px;}
  .nav.prev{left:8px;} .nav.next{right:8px;}
}

@media (prefers-reduced-motion:reduce){
  .flip{transition:opacity var(--turn) ease;}
  .flip.turning .shade{animation:none;}
  .hint .arw{animation:none;}
}
</style>
</head>

/* ---------- FLIP ENGINE ---------- */
const N = pages.length;                 // 8 pages → 4 spreads
const leftEl=document.getElementById('leftPage');
const rightEl=document.getElementById('rightPage');
const flip=document.getElementById('flip');
const flipFront=document.getElementById('flipFront');
const flipBack=document.getElementById('flipBack');
const counter=document.getElementById('counter');
const btnPrev=document.getElementById('prev');
const btnNext=document.getElementById('next');
const DUR=900;

let pos=0;                              // source of truth: current page index 0..N-1
let animating=false;
const isMobile=()=>window.matchMedia('(max-width:760px)').matches;

function render(){
  if(isMobile()){
    rightEl.innerHTML=pages[pos];
    leftEl.innerHTML='';
  }else{
    const s=Math.floor(pos/2);
    leftEl.innerHTML=pages[s*2];
    rightEl.innerHTML=pages[s*2+1] ?? '';
  }
  updateUI();
}
function updateUI(){
  const shown=isMobile()?pos:Math.floor(pos/2)*2;
  counter.innerHTML='<b>'+String(pos+1).padStart(2,'0')+'</b> / '+String(N).padStart(2,'0');
  btnPrev.disabled=(pos<=0);
  btnNext.disabled=(pos>=N-1);
}
function setFlip(rot){ flip.style.transition='none'; flip.style.transform='rotateY('+rot+'deg)';
  flip.offsetHeight; flip.style.transition=''; }

function next(){
  if(animating) return;
  if(isMobile()){                       // single-page turn
    if(pos>=N-1) return; animating=true;
    flipFront.innerHTML=pages[pos]; flipBack.innerHTML=pages[pos+1];
    rightEl.innerHTML=pages[pos+1];
    flip.classList.add('show'); setFlip(0);
    requestAnimationFrame(()=>{flip.classList.add('turning');flip.style.transform='rotateY(-180deg)';});
    finalize(()=>{pos++;});
    return;
  }
  const s=Math.floor(pos/2);
  if(s*2+1>=N-1) return;                 // already at last spread
  animating=true;
  flipFront.innerHTML=pages[s*2+1];
  flipBack.innerHTML=pages[s*2+2] ?? '';
  rightEl.innerHTML=pages[s*2+3] ?? '';  // reveal beneath
  flip.classList.add('show'); setFlip(0);
  requestAnimationFrame(()=>{flip.classList.add('turning');flip.style.transform='rotateY(-180deg)';});
  finalize(()=>{ leftEl.innerHTML=pages[s*2+2] ?? ''; pos=(s+1)*2; });
}

function prev(){
  if(animating) return;
  if(isMobile()){
    if(pos<=0) return; animating=true;
    flipFront.innerHTML=pages[pos-1]; flipBack.innerHTML=pages[pos];
    flip.classList.add('show'); setFlip(-180);
    requestAnimationFrame(()=>{flip.classList.add('turning');flip.style.transform='rotateY(0deg)';});
    finalize(()=>{pos--; rightEl.innerHTML=pages[pos];});
    return;
  }
  const s=Math.floor(pos/2);
  if(s<=0) return; animating=true;
  flipFront.innerHTML=pages[s*2-1];
  flipBack.innerHTML=pages[s*2];
  leftEl.innerHTML=pages[s*2-2] ?? '';   // reveal beneath on left
  flip.classList.add('show'); setFlip(-180);
  requestAnimationFrame(()=>{flip.classList.add('turning');flip.style.transform='rotateY(0deg)';});
  finalize(()=>{ rightEl.innerHTML=pages[s*2-1]; pos=(s-1)*2; });
}

function finalize(apply){                // timeout-based → robust incl. reduced-motion
  setTimeout(()=>{
    apply();
    flip.classList.remove('turning');
    flip.classList.remove('show');
    render();
    animating=false;
  },DUR+30);
}

/* ---------- INPUT ---------- */
btnNext.addEventListener('click',next);
btnPrev.addEventListener('click',prev);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
});
// click halves of the book
document.getElementById('book').addEventListener('click',e=>{
  if(e.target.closest('a')) return;
  const r=e.currentTarget.getBoundingClientRect();
  (e.clientX-r.left > r.width/2) ? next() : prev();
});
// swipe
let sx=0,sy=0;
const stage=document.querySelector('.stage');
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); }
},{passive:true});

// re-render on mode change (desktop spread <-> mobile single)
let wasMobile=isMobile();
window.addEventListener('resize',()=>{
  if(isMobile()!==wasMobile){ wasMobile=isMobile();
    if(!isMobile()) pos=Math.floor(pos/2)*2;   // snap to spread start
    if(!animating) render();
  }
});

render();
</script>
