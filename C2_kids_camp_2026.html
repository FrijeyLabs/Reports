<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Conecta2 Kids — Campistas</title>
<style>
  :root{
    --bg:#0B1020; --bg-soft:#0E1428; --side:#090D18;
    --card:rgba(255,255,255,.045); --card-bd:rgba(255,255,255,.08);
    --card2:#141C31; --card2-bd:rgba(255,255,255,.06);
    --panel:#10172A;
    --text:#FFFFFF; --t2:#AAB3C6; --t3:#6F788C;
    --green:#2FD071; --green-2:#28BA63; --green-soft:rgba(47,208,113,.14);
    --amber:#FFB224; --amber-soft:rgba(255,178,36,.13);
    --coral:#FF6B6B; --coral-soft:rgba(255,107,107,.13);
    --teal:#34D39A; --teal-soft:rgba(52,211,154,.13);
    --hair:rgba(255,255,255,.07);
    --chip-on:#F3F6FC; --chip-on-t:#0B1020;
    --r:24px; --r-sm:16px; --r-xs:12px;
    --sh-card:0 14px 34px -18px rgba(0,0,0,.7);
    --sh-fab:0 16px 36px -10px rgba(47,208,113,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Inter","Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- shell ---------- */
  .app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .side{display:none}
  .main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .body::-webkit-scrollbar{display:none}
  .view{padding:12px 16px calc(120px + env(safe-area-inset-bottom))}
  .view-campistas{display:flex;flex-direction:column;gap:12px}

  /* ---------- top header ---------- */
  .top{
    flex:0 0 auto;position:relative;z-index:20;padding:6px 16px 12px;padding-top:calc(8px + env(safe-area-inset-top));
    background:linear-gradient(180deg, rgba(11,16,32,.94), rgba(11,16,32,.8));
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .brandrow{display:flex;align-items:center;gap:10px}
  .title{font-size:21px;font-weight:700;letter-spacing:-.02em}
  .title .yr{color:var(--green)}
  .bell{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--hair);position:relative;cursor:pointer}
  .bell .pip{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #11182b}
  .sub{color:var(--t3);font-size:12.5px;margin-top:4px;font-weight:500}
  .toolbar{margin-top:14px}
  .search{position:relative}
  .search .mag{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--t3);display:grid}
  .search input{width:100%;height:48px;border:1px solid var(--card-bd);background:rgba(255,255,255,.05);border-radius:16px;padding:0 16px 0 44px;font:inherit;font-size:16px;color:var(--text);outline:none;transition:border-color .15s, background .15s}
  .search input::placeholder{color:var(--t3)}
  .search input:focus{border-color:rgba(47,208,113,.5);background:rgba(255,255,255,.07)}
  .chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--card-bd);color:var(--t2);font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:all .15s}
  .chip .em{font-size:14px;line-height:1}
  .chip .ct{font-size:12.5px;font-weight:700;color:var(--t3)}
  .chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-t);border-color:var(--chip-on)}
  .chip[aria-pressed="true"] .ct{color:rgba(11,16,32,.55)}

  /* ---------- camper card ---------- */
  .card{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);padding:14px 15px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sh-card)}
  .head{display:flex;align-items:center;gap:13px;cursor:pointer}
  .av{position:relative;flex:0 0 auto;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600;color:#fff}
  .av.sm{width:40px;height:40px;font-size:16px}
  .av .dot{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;border:2.5px solid #121A2E}
  .who{flex:1 1 auto;min-width:0}
  .name{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subln{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--t2);margin-top:2px}
  .subln .gem{font-size:13px}
  .tut{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t3);margin-top:3px;min-width:0}
  .tut span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tut svg{flex:0 0 auto}
  .flag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--coral);background:var(--coral-soft);padding:3px 8px;border-radius:7px;margin-top:6px}
  .chevx{flex:0 0 auto;color:var(--t3);align-self:flex-start;margin-top:2px;transition:transform .3s}
  .card.open .chevx{transform:rotate(180deg)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:13px;border-top:1px solid var(--hair)}
  .phl{display:flex;align-items:center;gap:9px;color:var(--t2);font-size:14.5px;min-width:0}
  .phl svg{flex:0 0 auto;color:var(--t3)}
  .footr{display:flex;align-items:center;gap:8px}
  .wa{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:var(--r-xs);background:var(--green-soft);color:var(--green);border:1px solid rgba(47,208,113,.28);font:inherit;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
  .wa.dim{background:rgba(255,255,255,.04);color:var(--t3);border-color:var(--hair)}
  .arr{color:var(--t3);display:grid}

  /* ---------- accordion detail (mobile) ---------- */
  .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.4,0,.2,1)}
  .card.open .more{grid-template-rows:1fr}
  .moreIn{overflow:hidden;min-height:0}
  .sect{margin-top:18px}
  .sect-h{font-size:15.5px;font-weight:600;margin-bottom:12px;letter-spacing:-.01em}
  .alert{display:flex;gap:11px;padding:12px;border-radius:var(--r-sm);margin-bottom:8px;align-items:flex-start}
  .alert .ae{font-size:16px;line-height:1.2;flex:0 0 auto}
  .alert .al{font-size:12px;font-weight:700;letter-spacing:.02em;margin-bottom:2px;opacity:.9}
  .alert .ad{font-size:13.5px;color:var(--text);line-height:1.4}
  .alert.amb{background:var(--amber-soft)} .alert.amb .al{color:var(--amber)}
  .alert.tea{background:var(--teal-soft)} .alert.tea .al{color:var(--teal)}
  .alert.cor{background:var(--coral-soft)} .alert.cor .al{color:var(--coral)}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:15px 14px}
  .fact{min-width:0}
  .fact.full{grid-column:1 / -1}
  .fl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);margin-bottom:4px}
  .fl svg{flex:0 0 auto}
  .fv{font-size:15px;color:var(--text);word-break:break-word}
  .fv.pho{display:flex;align-items:center;gap:9px}
  .wam{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;text-decoration:none}
  .contact{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--card2-bd);border-radius:var(--r-sm);padding:11px 12px;margin-bottom:9px}
  .contact .cav{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:600;color:#fff}
  .contact .ci{flex:1 1 auto;min-width:0}
  .contact .cn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:600}
  .contact .cr{font-size:11px;color:var(--t2);background:rgba(255,255,255,.07);padding:2px 8px;border-radius:7px;font-weight:600}
  .contact .cp{font-size:13px;color:var(--t2);margin-top:2px}
  .notes{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--card2);border:1px solid var(--card2-bd);border-radius:var(--r-sm);padding:13px 14px}
  .notes textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text);font:inherit;font-size:14px;resize:none;min-height:22px;line-height:1.5}
  .notes textarea::placeholder{color:var(--t3)}
  .pen{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--t2);background:rgba(255,255,255,.05);border:none;cursor:pointer}
  .editrow{display:flex;gap:10px;margin-top:16px}
  .editrow button{flex:1;height:46px;border-radius:var(--r-xs);font:inherit;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid transparent}
  .b-report{background:transparent;color:var(--coral);border-color:rgba(255,107,107,.3)}
  .b-edit{background:var(--green);color:#06210f;border-color:var(--green)}
  .noinfo{font-size:14px;color:var(--t3);padding:14px;background:var(--card2);border:1px solid var(--card2-bd);border-radius:var(--r-sm);margin-top:16px;text-align:center}

  /* ---------- empty / skeleton ---------- */
  .empty{text-align:center;color:var(--t2);padding:60px 24px}
  .empty .big{font-size:34px;margin-bottom:10px}
  .empty .es{font-size:14px;color:var(--t3);margin-top:4px}
  .skel{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r);padding:14px 15px;display:flex;gap:13px;align-items:center;margin-bottom:12px}
  .skel .sc{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.06);flex:0 0 auto}
  .skel .sl{flex:1}
  .skel .sb{height:13px;border-radius:7px;background:rgba(255,255,255,.06);margin-bottom:9px}
  .shim{position:relative;overflow:hidden}
  .shim::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);transform:translateX(-100%);animation:shim 1.2s infinite}
  @keyframes shim{100%{transform:translateX(100%)}}

  /* ---------- confidentiality banner ---------- */
  .priv{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:var(--r-sm);padding:13px 14px;margin-top:2px}
  .priv .shield{flex:0 0 auto;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--green);background:var(--green-soft)}
  .priv .pt{font-size:13px;font-weight:600}
  .priv .ps{font-size:11.5px;color:var(--t3);margin-top:2px;line-height:1.35}

  /* ---------- attendance ---------- */
  .seg{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--card-bd);border-radius:13px;padding:3px;gap:3px;margin-bottom:16px}
  .seg button{border:none;background:none;color:var(--t2);font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--green);color:#06210f}
  .attsum{display:flex;gap:16px;margin-bottom:16px;font-size:13.5px;color:var(--t2);flex-wrap:wrap}
  .attsum b{font-size:15px}
  .attrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:9px}
  .who2{flex:1 1 auto;min-width:0}
  .attbtns{display:flex;gap:6px;flex:0 0 auto}
  .attbtns button{border:1px solid var(--card-bd);background:rgba(255,255,255,.04);color:var(--t2);font:inherit;font-weight:600;font-size:12.5px;padding:9px 13px;border-radius:10px;cursor:pointer}
  .att-p[aria-pressed="true"]{background:var(--green-soft);border-color:rgba(47,208,113,.4);color:var(--green)}
  .att-a[aria-pressed="true"]{background:var(--coral-soft);border-color:rgba(255,107,107,.4);color:var(--coral)}

  /* ---------- health / more ---------- */
  .hsec{margin-bottom:24px}
  .hsec-h{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin-bottom:12px}
  .ct2{font-size:12px;font-weight:700;color:var(--t3);background:rgba(255,255,255,.06);padding:2px 9px;border-radius:8px}
  .hrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .hd{flex:1 1 auto;min-width:0}
  .hrow .subln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .hrow .arrr{color:var(--t3);flex:0 0 auto;display:grid}
  .mrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r-sm);padding:14px;cursor:pointer;margin-bottom:9px}
  .mrow .mi{flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--t2)}
  .mrow .mt{flex:1 1 auto;min-width:0}
  .mrow.danger .mi{color:var(--coral);background:var(--coral-soft)}
  .mrow.danger .name{color:var(--coral)}
  .mrow .arrr{color:var(--t3);display:grid}
  .repcard{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r-sm);padding:13px 14px;margin-bottom:9px}
  .rc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .rc-x{background:var(--green-soft);color:var(--green);border:none;border-radius:8px;padding:6px 12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;flex:0 0 auto}
  .rc-tx{font-size:14px;color:var(--t2);line-height:1.45}
  .aboutcard{background:var(--card);border:1px solid var(--card-bd);border-radius:var(--r-sm);padding:16px}
  .muted-note{color:var(--t3);font-size:13.5px;padding:6px 2px}

  /* ---------- FAB + tabs (mobile) ---------- */
  .fab{position:absolute;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;display:inline-flex;align-items:center;gap:9px;height:54px;padding:0 20px 0 18px;border-radius:18px;border:none;cursor:pointer;background:linear-gradient(180deg,#34DC78,#21B85E);color:#06210f;font:inherit;font-weight:700;font-size:15px;box-shadow:var(--sh-fab)}
  .tabs{flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;height:64px;padding-bottom:env(safe-area-inset-bottom);background:rgba(11,16,32,.82);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-top:1px solid rgba(255,255,255,.06)}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--t3);font-size:10.5px;font-weight:600;background:none;border:none;cursor:pointer;padding:6px 14px}
  .tabs button[aria-selected="true"]{color:var(--green)}

  /* ---------- overlay panel (sheet on mobile, dialog on desktop) ---------- */
  .ov{position:fixed;inset:0;z-index:100;background:rgba(3,5,12,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
  .ov.on{opacity:1;pointer-events:auto}
  .panel{width:100%;background:var(--panel);border-top:1px solid rgba(255,255,255,.08);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:92dvh;overflow-y:auto}
  .ov.on .panel{transform:translateY(0)}
  .panel::-webkit-scrollbar{display:none}
  .grab{width:38px;height:5px;border-radius:5px;background:rgba(255,255,255,.18);margin:0 auto 14px}
  .panel h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px}
  .sh-sub{color:var(--t3);font-size:13px;margin:4px 0 14px}
  .callrow{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--card2-bd);border-radius:var(--r-sm);padding:12px;margin-bottom:9px;text-decoration:none;color:var(--text)}
  .callrow .cav{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;font-size:16px}
  .callrow .ci{flex:1;min-width:0}
  .callrow .cn{font-size:15px;font-weight:600}
  .callrow .cm{font-size:12.5px;color:var(--t2);margin-top:2px}
  .callbtn{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff}
  .call-911{background:linear-gradient(180deg,#FF5A5A,#E23B3B)}
  .call-911 .callbtn{background:rgba(255,255,255,.18)}
  .call-c .callbtn{background:var(--green)}
  .panel .hint{font-size:12.5px;color:var(--t3);text-align:center;margin-top:6px}

  /* detail dialog header */
  .dhead{display:flex;align-items:center;gap:13px;margin-bottom:14px}
  .x{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--t2);background:rgba(255,255,255,.06);border:none;cursor:pointer;flex:0 0 auto}
  .dfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .ph{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .ph h2{font-size:19px}

  /* edit / report forms */
  .frow{margin-bottom:13px}
  .frow>label{display:block;font-size:12.5px;color:var(--t2);margin-bottom:6px;font-weight:600}
  .frow input,.frow textarea,.frow select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--card-bd);border-radius:12px;padding:11px 12px;color:var(--text);font:inherit;font-size:15px;outline:none}
  .frow input:focus,.frow textarea:focus,.frow select:focus{border-color:rgba(47,208,113,.5)}
  .frow textarea{resize:vertical;min-height:90px;line-height:1.5}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fsec-h{font-size:13px;font-weight:700;color:var(--t2);margin:20px 0 10px;letter-spacing:.02em}
  .ftoggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:12px;margin-bottom:8px;font-size:14.5px;font-weight:600;cursor:pointer}
  .switch{position:relative;display:inline-block;width:46px;height:28px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch .track{position:absolute;inset:0;background:rgba(255,255,255,.16);border-radius:999px;transition:.2s}
  .switch .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked + .track{background:var(--green)}
  .switch input:checked + .track::after{transform:translateX(18px)}
  .ccard{background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:14px;padding:12px;margin-bottom:10px}
  .formbtns{display:flex;gap:10px;margin-top:20px;position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--panel) 35%);padding-top:14px}
  .formbtns button{flex:1;height:48px;border-radius:14px;font:inherit;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer}
  .b-ghost{background:transparent;border-color:var(--hair);color:var(--t2)}
  .b-save{background:var(--green);color:#06210f}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(14px);z-index:120;background:#1b2236;color:#fff;border:1px solid rgba(255,255,255,.1);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ============ DESKTOP ============ */
  @media (min-width:860px){
    .app{display:grid;grid-template-columns:264px 1fr;height:100vh}
    .side{
      display:flex;flex-direction:column;gap:4px;padding:22px 16px;border-right:1px solid var(--hair);
      background:var(--side);overflow-y:auto;
    }

  [k.phone,base.phone,base.phone2,...((base.contacts||[]).map(c=>c[2]))].forEach(p=>{const d=digits(p);if(d)parts.push(d);});
  return { base, v:Object.assign({},base), hay:parts.filter(Boolean).join(' ').toLowerCase() };
});
function applyEdits(){
  ITEMS.forEach(it=>{
    const e=edits[it.base.n];
    if(e){ it.v=Object.assign({},it.base,e); it.v.hasForm=true; }
    else { it.v=Object.assign({},it.base); }
  });
}
const med = v => v.medical||v.meds||v.meds_camp;

/* ---------- filters ---------- */
const FILTERS=[
  {f:'all',     em:'',  label:'Todos',          cnt:()=>ITEMS.length},
  {f:'allergy', em:'⚠️', label:'Alergias',       cnt:()=>ITEMS.filter(i=>i.v.allergy).length},
  {f:'diet',    em:'🥗', label:'Dieta especial', cnt:()=>ITEMS.filter(i=>i.v.diet).length},
  {f:'medical', em:'💊', label:'Médico',         cnt:()=>ITEMS.filter(i=>med(i.v)).length},
];
function renderChips(){
  $('#chips').innerHTML = FILTERS.map(c=>
    `<button class="chip" data-f="${c.f}" aria-pressed="${filter===c.f}">${c.em?`<span class="em">${c.em}</span>`:''}${c.label} <span class="ct">${c.cnt()}</span></button>`
  ).join('');
}
function qMatch(item){ if(!query) return true; for(const t of query.split(/\s+/).filter(Boolean)) if(!item.hay.includes(t)) return false; return true; }
function matches(item){
  const v=item.v;
  if(filter==='allergy' && !v.allergy) return false;
  if(filter==='diet' && !v.diet) return false;
  if(filter==='medical' && !med(v)) return false;
  return qMatch(item);
}

function exportContacts(){
  try{
    const map=new Map(); // tel -> {name, role, tel, kids:Set}
    function add(name, rawPhone, role, child){
      const tel=vcardTel(rawPhone); if(!tel) return;
      let e=map.get(tel);
      if(!e){ e={name:name||'', role:role||'', tel, kids:new Set()}; map.set(tel,e); }
      if(!e.name && name) e.name=name;
      if(!e.role && role) e.role=role;
      if(child) e.kids.add(child);
    }
    ITEMS.forEach(it=>{ const v=it.v;
      if(v.parent) add(titleCase(v.parent), v.phone, v.relation||'Tutor', v.name);
      (v.contacts||[]).forEach(c=>{ if(c[0]||c[2]) add(titleCase(c[0]||''), c[2], c[1]||'Contacto', v.name); });
    });
    if(!map.size){ toast('No hay contactos con teléfono para exportar.'); return; }
    const cards=[];
    for(const e of map.values()){
      const kids=[...e.kids].join(', ');
      const fn=e.name || ('Tutor de '+([...e.kids][0]||'Campista'));
      const note=(e.role||'Contacto')+(kids?(' de '+kids):'')+' · Conecta2 Kids 2026';
      cards.push(['BEGIN:VCARD','VERSION:3.0','N:;'+vesc(fn)+';;;','FN:'+vesc(fn),
        'ORG:Conecta2 Kids 2026','TEL;TYPE=CELL:'+e.tel,'NOTE:'+vesc(note),'END:VCARD'].join('\r\n'));
    }
    const vcf=cards.join('\r\n')+'\r\n';
    const blob=new Blob([vcf],{type:'text/vcard;charset=utf-8'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='conecta2-contactos.vcf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(map.size+' contactos descargados (.vcf)');
  }catch(e){ toast('No se pudo exportar en este dispositivo.'); }
}
function resetData(){
  if(typeof confirm==='function' && !confirm('¿Borrar todas las notas, asistencia y cambios guardados en este dispositivo? No se puede deshacer.')) return;
  notesMap={}; attendance={}; edits={}; reports={};
  Store.set('notes',notesMap); Store.set('attendance',attendance); Store.set('edits',edits); Store.set('reports',reports);
  applyEdits(); renderChips(); renderTab(); toast('Datos locales restablecidos.');
}
/* ---------- diffusion message + contacts (.vcf) ---------- */
function tutorContacts(){
  const map=new Map();
  ITEMS.forEach(it=>{ const v=it.v; const num=waNumber(v.phone); if(!num||num.length<11) return;
    if(!map.has(num)) map.set(num,{tutor:(v.parent||'').trim()||'Tutor', num, kids:[]});
    const e=map.get(num); if(v.name && !e.kids.includes(v.name)) e.kids.push(v.name);
    if((!e.tutor||e.tutor==='Tutor') && v.parent) e.tutor=v.parent.trim();
  });
  return [...map.values()];
}
function buildDiffusionPrompt(group){
  group=(group||'').trim()||'Conecta2 Kids 2026';
  const list=tutorContacts();
  const lines=list.map(c=>`- +${c.num}  ·  ${c.tutor}${c.kids.length?` (${c.kids.join(', ')})`:''}`).join('\n');
  return [
`Eres un agente que controla el navegador (Claude para Chrome). Tu tarea es AGREGAR una lista de contactos a un grupo de WhatsApp ya existente. No envíes ningún mensaje; solo agrega participantes.`,
``,
`Grupo de WhatsApp destino: "${group}"`,
``,
`Pasos:`,
`1. Abre https://web.whatsapp.com y verifica que la sesión esté iniciada.`,
`2. Abre el grupo llamado "${group}". Si no existe, créalo con ese nombre.`,
`3. Entra a "Datos del grupo" y luego "Añadir participante".`,
`4. Para cada número de la lista, búscalo y agrégalo al grupo, uno por uno y en orden.`,
`5. Si un número no tiene WhatsApp o no se puede agregar, anótalo y continúa con el siguiente.`,
`6. Al terminar, dame un resumen: cuántos se agregaron y cuáles fallaron.`,
``,
`Los números están en formato internacional de República Dominicana (+1). Son ${list.length} contactos:`,
``,
lines
  ].join('\n');
}

  group=group||'Conecta2 Kids 2026';

  return `<div class="ph"><h2>Mensaje de difusión</h2><button class="x" data-act="close" aria-label="Cerrar">${I.x}</button></div>
  <div class="form">
    <p class="sh-sub" style="margin:0 0 14px">Texto listo para pegar en Claude (Chrome). El agente abrirá WhatsApp y agregará los ${count} números de los tutores al grupo, uno por uno.</p>
    <div class="frow"><label>Nombre del grupo de WhatsApp</label><input data-field="group" value="${esc(group)}"></div>
    <div class="frow"><label>Texto generado</label><textarea class="diff-out" rows="10" spellcheck="false">${esc(buildDiffusionPrompt(group))}</textarea></div>
    <div class="formbtns">
      <button class="b-ghost" data-act="close">Cerrar</button>
      <button class="b-save" data-act="copy-diff">Copiar texto</button>
    </div>
  </div>`;
}
function openDiffusion(){ openPanel(diffusionHTML('Conecta2 Kids 2026')); }
function fallbackCopy(t){
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); ta.remove(); toast('Texto copiado.'); }
  catch(e){ toast('Selecciona y copia el texto manualmente.'); }
}
function copyText(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast('Texto copiado.'),()=>fallbackCopy(t)); return; } }catch(e){}
  fallbackCopy(t);
}
function copyDiffusion(){ const el=$('#panel').querySelector('.diff-out'); if(el) copyText(el.value); }
function vesc(s){ return (s==null?'':String(s)).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); }
function downloadVCF(){
  try{
    const list=tutorContacts();
    const cards=list.map(c=>['BEGIN:VCARD','VERSION:3.0','N:'+vesc(c.tutor)+';;;;','FN:'+vesc(c.tutor),
      'ORG:Conecta2 Kids 2026','TEL;TYPE=CELL:+'+c.num,
      'NOTE:'+vesc('Tutor de '+c.kids.join(', ')+' — Campamento Conecta2 Kids 2026'),'END:VCARD'].join('\r\n')).join('\r\n');
    const blob=new Blob([cards],{type:'text/vcard;charset=utf-8'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='conecta2-kids-contactos.vcf'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast(list.length+' contactos descargados.');
  }catch(e){ toast('No se pudo descargar en este dispositivo.'); }
}

      <div class="mrow" data-act="vcf"><div class="mi">${I.user}</div><div class="mt"><div class="name">Descargar contactos (.vcf)</div><div class="subln">Guarda los números de los tutores en tu teléfono</div></div><span class="arrr">${I.arr}</span></div>

        <div class="subln" style="margin-top:6px;white-space:normal">${Store.ok?'Tus notas, asistencia y cambios se guardan en este dispositivo.':'Modo temporal: los cambios no se guardarán al cerrar la app.'}</div>

/* ---------- skeleton / toast / autosize ---------- */
function skeleton(){
  $('#view').innerHTML = Array.from({length:5}).map(()=>
    `<div class="skel shim"><div class="sc"></div><div class="sl"><div class="sb" style="width:55%"></div><div class="sb" style="width:35%;height:11px"></div><div class="sb" style="width:70%;height:11px;margin-bottom:0"></div></div></div>`
  ).join('');
}
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1900); }
function autosize(){ document.querySelectorAll('.ntx').forEach(t=>{ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }); }

/* ---------- tabs / dispatch ---------- */
function setTab(name){
  tab=name;
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===name)));
  document.querySelector('.search').style.display = name==='mas'?'none':'';
  $('#chips').style.display = name==='campistas'?'':'none';
  $('#q').placeholder = name==='asistencias'?'Buscar en asistencia…':(name==='salud'?'Buscar en salud…':'Buscar campistas…');
  $('#overlay').classList.remove('on');
  renderTab();
  $('#view').parentElement.scrollTop=0;
}
function renderTab(){
  const v=$('#view'); v.className='view view-'+tab;
  if(tab==='campistas') renderCampistas(v);
  else if(tab==='asistencias') renderAsistencias(v);
  else if(tab==='salud') renderSalud(v);
  else renderMas(v);
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  if(e.target.closest('a')) return;                 // native links (WhatsApp / tel) win
  const tb=e.target.closest('[data-tab]'); if(tb){ setTab(tb.dataset.tab); return; }
  const ch=e.target.closest('.chip[data-f]'); if(ch){ filter=ch.dataset.f; renderChips(); renderTab(); return; }
  const act=e.target.closest('[data-act]'); if(!act) return;
  const a=act.dataset.act;
  const n=act.dataset.n!=null?+act.dataset.n:null;
  switch(a){
    case 'toggle':{ const card=act.closest('.card'); card.classList.toggle('open'); if(card.classList.contains('open')) lastKidN=+card.dataset.id; break; }
    case 'open': openDetail(n!=null?n:+act.closest('.card').dataset.id); break;
    case 'close': closePanel(); break;
    case 'edit': openEdit(n); break;
    case 'report': openReport(n); break;
    case 'save-edit': saveEdit(n); break;
    case 'save-report': saveReport(n); break;
    case 'resolve': resolveReport(n); break;
    case 'att': setAtt(n, act.dataset.day, act.dataset.val); break;
    case 'day': curDay=act.dataset.day; renderTab(); break;
    case 'emergency': openSheet(); break;
    case 'export': exportData(); break;
    case 'contacts': exportContacts(); break;
    case 'reset': resetData(); break;
    case 'bell': toast('No tienes notificaciones nuevas.'); break;
    case 'diffusion': openDiffusion(); break;
    case 'vcf': downloadVCF(); break;
    case 'copy-diff': copyDiffusion(); break;
    case 'focusnotes':{ const root=act.closest('.panel')||act.closest('.card'); const ta=root&&root.querySelector('.ntx'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);} break; }
  }
});
document.addEventListener('input', e=>{
  const ta=e.target.closest('.ntx');
  if(ta){ notesMap[+ta.dataset.n]=ta.value; Store.set('notes',notesMap); ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
});
$('#q').addEventListener('input', e=>{ query=e.target.value.trim().toLowerCase(); renderTab(); });
$('#overlay').addEventListener('click', e=>{ if(e.target===$('#overlay')) closePanel(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });
window.addEventListener('resize', ()=>{ const d=isDesktop(); if(d!==desk){ desk=d; renderTab(); } });

/* ---------- init ---------- */
applyEdits();
renderChips();
skeleton();
setTimeout(()=>setTab('campistas'), 320);
</script>
